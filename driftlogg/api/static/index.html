<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriftLogg</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #9aa3b2;
    --accent: #5b9dff;
    --high: #ff6b6b;
    --elevated: #ffb454;
    --low: #4ec9a5;
    --unknown: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 40px 24px 80px; }
  header { margin-bottom: 32px; }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; }
  .banner {
    margin-top: 16px; padding: 10px 14px; border-radius: 8px;
    background: rgba(255,180,84,.1); border: 1px solid rgba(255,180,84,.3);
    color: var(--elevated); font-size: 13px; display: none;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  textarea, input[type=file] {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
  }
  textarea { min-height: 90px; resize: vertical; }
  button {
    background: var(--accent); color: #08111f; border: 0; border-radius: 8px;
    padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab {
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
    color: var(--muted); background: transparent; border: 1px solid transparent;
  }
  .tab.on { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  .stats { display: flex; gap: 24px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat .n { font-size: 24px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-left-width: 3px; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px;
  }
  .card.high { border-left-color: var(--high); }
  .card.elevated { border-left-color: var(--elevated); }
  .card.low { border-left-color: var(--low); }
  .card.unknown { border-left-color: var(--unknown); }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .pkg { font-weight: 600; font-family: ui-monospace, Menlo, monospace; }
  .repo { color: var(--muted); font-size: 12px; }
  .score { font-variant-numeric: tabular-nums; font-weight: 700; }
  .score.high { color: var(--high); }
  .score.elevated { color: var(--elevated); }
  .score.low { color: var(--low); }
  .score.unknown { color: var(--unknown); }
  .reasons { margin: 8px 0 0; padding: 0; list-style: none; }
  .reasons li { color: var(--muted); font-size: 13px; padding: 1px 0; }
  .reasons li::before { content: "→ "; color: var(--accent); }
  .err { color: var(--high); font-size: 13px; margin-top: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.25);
    border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DriftLogg</h1>
    <div class="sub">Which of your dependencies are heading for abandonment</div>
    <div class="banner" id="banner"></div>
  </header>

  <div class="panel">
    <div class="tabs">
      <div class="tab on" data-tab="names">Package names</div>
      <div class="tab" data-tab="file">Upload manifest</div>
    </div>

    <div id="pane-names">
      <textarea id="names" placeholder="express&#10;lodash&#10;request&#10;left-pad"></textarea>
    </div>

    <div id="pane-file" style="display:none">
      <input type="file" id="file" accept=".json,.txt">
      <div class="sub" style="margin-top:8px">package.json or requirements.txt</div>
    </div>

    <div class="row" style="margin-top:14px">
      <button id="go">Analyze</button>
      <span class="sub" id="hint">Each package takes a few seconds to score.</span>
    </div>
  </div>

  <div id="out"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let mode = "names";

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    mode = t.dataset.tab;
    $("#pane-names").style.display = mode === "names" ? "" : "none";
    $("#pane-file").style.display = mode === "file" ? "" : "none";
  };
});

async function checkHealth() {
  try {
    const h = await (await fetch("/health")).json();
    if (!h.model_loaded) {
      const b = $("#banner");
      b.style.display = "block";
      b.textContent = "No trained model yet — scores come from the inactivity baseline. Run scripts/04_train.py.";
    }
    if (!h.github_token_present) {
      const b = $("#banner");
      b.style.display = "block";
      b.textContent += " No GitHub token set; you will hit rate limits fast.";
    }
  } catch (e) { /* health is advisory only */ }
}

function pct(x) { return x === null || x === undefined ? "—" : (x * 100).toFixed(0) + "%"; }

function render(data) {
  const high = data.results.filter(r => r.band === "high").length;
  const elev = data.results.filter(r => r.band === "elevated").length;

  const stats = `
    <div class="stats">
      <div class="stat"><div class="n">${data.total}</div><div class="l">Analyzed</div></div>
      <div class="stat"><div class="n" style="color:var(--high)">${high}</div><div class="l">High risk</div></div>
      <div class="stat"><div class="n" style="color:var(--elevated)">${elev}</div><div class="l">Elevated</div></div>
      <div class="stat"><div class="n">${data.horizon_days}d</div><div class="l">Horizon</div></div>
    </div>`;

  const cards = data.results.map(r => `
    <div class="card ${r.band}">
      <div class="card-top">
        <div>
          <span class="pkg">${r.package}</span>
          ${r.repo ? `<span class="repo"> · ${r.repo}</span>` : ""}
        </div>
        <span class="score ${r.band}">${pct(r.score)}</span>
      </div>
      ${r.reasons.length ? `<ul class="reasons">${r.reasons.map(x => `<li>${x.label}</li>`).join("")}</ul>` : ""}
      ${r.error ? `<div class="err">${r.error}</div>` : ""}
    </div>`).join("");

  $("#out").innerHTML = `<div class="panel">${stats}${cards}</div>
    <div class="sub" style="text-align:center">Scored by ${data.model_kind}</div>`;
}

$("#go").onclick = async () => {
  const btn = $("#go");
  btn.disabled = true;
  $("#out").innerHTML = `<div class="panel empty"><span class="spinner"></span>Scoring…</div>`;

  try {
    let res;
    if (mode === "names") {
      const packages = $("#names").value.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
      if (!packages.length) throw new Error("Enter at least one package name.");
      res = await fetch("/score", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ packages })
      });
    } else {
      const f = $("#file").files[0];
      if (!f) throw new Error("Choose a manifest file.");
      const fd = new FormData();
      fd.append("file", f);
      res = await fetch("/score/manifest", { method: "POST", body: fd });
    }

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || "Request failed.");
    }
    render(await res.json());
  } catch (e) {
    $("#out").innerHTML = `<div class="panel empty" style="color:var(--high)">${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
};

checkHealth();
</script>
</body>
</html>
