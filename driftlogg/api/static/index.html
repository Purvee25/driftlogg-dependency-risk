<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriftLogg — dependency decay report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   DESIGN TOKENS

   Thesis: this is a diagnostic instrument, not a dashboard. It reports a
   forensic finding about decay. The visual language is borrowed from lab
   readouts and printed ledgers — hairline rules instead of cards, tabular
   figures, a warm paper ground, and oxidised pigments rather than UI primaries.

   Rules the system holds to:
     · No shadows. Depth comes from rules and weight, not elevation.
     · No border radius above 2px. Nothing is a pill.
     · Two faces, three roles: mono = display and data, sans = prose and labels.
     · Colour is earned. Only risk carries hue; everything else is ink on paper.
   ═════════════════════════════════════════════════════════════════════════ */
:root {
  /* ---- ground & ink ------------------------------------------------------ */
  --paper:      #f7f4ee;   /* warm stock, not white — white reads as default */
  --paper-sunk: #efebe2;   /* recessed fields */
  --ink:        #17150f;
  --ink-2:      #55503f;   /* secondary prose */
  --ink-3:      #8b8472;   /* labels, annotations */
  --rule:       #ddd7c9;   /* hairline */
  --rule-firm:  #c2baa6;   /* structural rule */

  /* ---- pigments ----------------------------------------------------------
     Oxidised, not saturated. These are pigment names on purpose: they sit
     next to each other without the RGB-primary clash of red/amber/green. */
  --oxide:  #a33a1c;   /* high risk   — burnt iron */
  --ochre:  #97701a;   /* elevated    — raw sienna */
  --verdi:  #3f6b4f;   /* healthy     — verdigris */
  --slate:  #8b8472;   /* unknown     */
  --mark:   #1f4b6e;   /* interactive — prussian, never a UI blue */

  /* ---- type --------------------------------------------------------------
     IBM Plex (Mike Abbink / Bold Monday, 2017). Chosen for provenance and
     technical character — a face drawn for engineering documentation, not a
     neutral UI grotesque. Mono carries display and data; Sans carries prose.
     Deliberately not Inter, and deliberately not a serif: reaching for a serif
     to seem editorial is the tell this design is trying to avoid. */
  --display: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --mono:    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:    "IBM Plex Sans", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;

  /* ---- measure ----------------------------------------------------------- */
  --gap-1: 4px;  --gap-2: 8px;  --gap-3: 14px;
  --gap-4: 22px; --gap-5: 36px; --gap-6: 58px;
  --hair: 1px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    /* Dark is NOT the light palette darkened. The warm paper cast that reads
       as stock in light reads as muddy brown at low luminance, so the ground
       goes near-neutral and the pigments gain chroma to survive it. */
    --paper:      #101011;
    --paper-sunk: #17171a;
    --ink:        #e9e7e2;
    --ink-2:      #9d9a94;
    --ink-3:      #6c6963;
    --rule:       #26262a;
    --rule-firm:  #3b3b40;
    --oxide:  #f0764c;
    --ochre:  #e0ad42;
    --verdi:  #6dbd8c;
    --slate:  #6c6963;
    --mark:   #82b4de;
  }
}
:root[data-theme="dark"] {
  /* Dark is NOT the light palette darkened. The warm paper cast that reads
     as stock in light reads as muddy brown at low luminance, so the ground
     goes near-neutral and the pigments gain chroma to survive it. */
  --paper:      #101011;
  --paper-sunk: #17171a;
  --ink:        #e9e7e2;
  --ink-2:      #9d9a94;
  --ink-3:      #6c6963;
  --rule:       #26262a;
  --rule-firm:  #3b3b40;
  --oxide:  #f0764c;
  --ochre:  #e0ad42;
  --verdi:  #6dbd8c;
  --slate:  #6c6963;
  --mark:   #82b4de;
}

/* ═══════════════════════════════════════════════════════ base ═══ */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.62 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
.sheet { max-width: 780px; margin: 0 auto; padding: 0 26px 96px; }

/* label: the small-caps annotation used throughout */
.label {
  font: 500 10px/1 var(--sans); letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-3);
}

/* ═══════════════════════════════════════════════════ masthead ═══ */
.masthead {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--gap-4); padding: var(--gap-5) 0 var(--gap-3);
  border-bottom: 2px solid var(--ink);
}
.masthead h1 {
  margin: 0; font: 600 27px/1 var(--display); letter-spacing: -.045em;
}
.masthead h1 em { font-style: normal; font-weight: 400; color: var(--ink-2); }
.masthead .sub {
  margin: 9px 0 0; font: 400 13.5px/1.5 var(--sans); color: var(--ink-2);
  max-width: 44ch;
}
.colophon { text-align: right; flex: none; }
.colophon .label + .label { margin-top: 5px; }
.theme {
  margin-top: 9px; background: none; border: 0; padding: 0; cursor: pointer;
  font: 500 10px/1 var(--sans); letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); border-bottom: 1px solid var(--rule-firm);
}
.theme:hover { color: var(--ink); border-color: var(--ink); }

/* ═══════════════════════════════════════════════════ advisory ═══ */
.advisory {
  display: none; margin-top: var(--gap-4); padding: var(--gap-3) 0;
  border-top: var(--hair) solid var(--ochre);
  border-bottom: var(--hair) solid var(--ochre);
  font: 400 13.5px/1.5 var(--sans); color: var(--ochre);
}
.advisory b { font: 500 10px/1 var(--sans); letter-spacing: .13em;
              text-transform: uppercase; display: block; margin-bottom: 5px; }

/* ═══════════════════════════════════════════════════════ query ═══ */
.query { padding: var(--gap-5) 0 var(--gap-4); }
.modes { display: flex; gap: var(--gap-4); margin-bottom: var(--gap-3); }
.mode {
  background: none; border: 0; padding: 0 0 5px; cursor: pointer;
  font: 500 10px/1 var(--sans); letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); border-bottom: 2px solid transparent;
}
.mode[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }

textarea {
  width: 100%; min-height: 116px; resize: vertical;
  padding: var(--gap-3); background: var(--paper-sunk); color: var(--ink);
  border: var(--hair) solid var(--rule); border-radius: 2px;
  font: 400 13.5px/1.85 var(--mono);
}
textarea:focus, .intake:focus-within { outline: 2px solid var(--mark); outline-offset: 1px; }
textarea::placeholder { color: var(--ink-3); }

.intake {
  border: var(--hair) dashed var(--rule-firm); border-radius: 2px;
  padding: var(--gap-5) var(--gap-4); text-align: center; cursor: pointer;
  transition: border-color .12s, background .12s;
}
.intake:hover, .intake.over { border-color: var(--mark); background: var(--paper-sunk); }
.intake p { margin: 0; font: 450 13.5px/1.5 var(--sans); color: var(--ink-2); }
.intake .formats { margin-top: 5px; font: 400 12px/1 var(--mono); color: var(--ink-3); }
.intake input { display: none; }

.specimens { display: flex; flex-wrap: wrap; align-items: baseline;
             gap: var(--gap-2) var(--gap-3); margin-top: var(--gap-3); }
.specimen {
  background: none; border: 0; padding: 0; cursor: pointer;
  font: 450 12.5px/1 var(--sans); color: var(--mark);
  border-bottom: var(--hair) solid var(--rule-firm);
}
.specimen:hover { border-color: var(--mark); }

.commit { display: flex; align-items: baseline; gap: var(--gap-3);
          margin-top: var(--gap-4); flex-wrap: wrap; }
.run {
  background: var(--ink); color: var(--paper); border: 0; border-radius: 2px;
  padding: 11px 24px; cursor: pointer;
  font: 500 11px/1 var(--sans); letter-spacing: .13em; text-transform: uppercase;
}
.run:hover:not(:disabled) { background: var(--mark); }
.run:disabled { opacity: .4; cursor: not-allowed; }
.aside { font: 400 12.5px/1.45 var(--sans); color: var(--ink-3); }

/* ═══════════════════════════════════════════════════ findings ═══ */
.findings { border-top: 2px solid var(--ink); padding-top: var(--gap-3); }
.findings-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--gap-3); flex-wrap: wrap; margin-bottom: var(--gap-4);
}
.tally { display: flex; gap: var(--gap-5); }
.tally .n { font: 500 31px/1 var(--display); letter-spacing: -.045em; }
.tally .n.risk { color: var(--oxide); }
.tally .label { margin-top: 6px; }

/* the distribution reads as a measured strip, square ends, hairline framed */
.strip { display: flex; height: 9px; border: var(--hair) solid var(--rule-firm); }
.strip span { transition: width .45s ease; }
.strip-key { display: flex; gap: var(--gap-3); margin-top: 7px; flex-wrap: wrap; }
.strip-key span { font: 400 12px/1 var(--mono); color: var(--ink-2); }
.swatch { display: inline-block; width: 8px; height: 8px; margin-right: 5px; }
.dist { min-width: 190px; flex: 1; }

/* ── one finding ─────────────────────────────────────────────────── */
.finding { padding: var(--gap-3) 0; border-top: var(--hair) solid var(--rule); }
.finding:first-of-type { border-top: var(--hair) solid var(--rule-firm); }
.line { display: flex; align-items: baseline; gap: var(--gap-2); }
.name { font: 500 14.5px/1.3 var(--mono); letter-spacing: -.02em; }
.origin { font: 400 12px/1.3 var(--mono); color: var(--ink-3);
          text-decoration: none; border-bottom: var(--hair) solid transparent; }
.origin:hover { color: var(--mark); border-color: var(--mark); }
.reading { margin-left: auto; font: 500 17px/1 var(--display); letter-spacing: -.035em; }

/* gauge: baseline rule with a filled span and a terminal tick — a measurement,
   not a progress bar. Square ends, hairline weight. */
.gauge { position: relative; height: 3px; background: var(--rule); margin: 9px 0 0; }
.gauge i { position: absolute; inset: 0 auto 0 0; display: block; transition: width .5s ease; }
.gauge b { position: absolute; top: -3px; bottom: -3px; width: 2px;
           transition: left .5s ease; }
.ticks { display: flex; justify-content: space-between; margin-top: 4px; }
.ticks span { font: 400 9px/1 var(--mono); color: var(--ink-3); }

.evidence { margin: var(--gap-2) 0 0; padding: 0; list-style: none; }
.evidence li {
  font: 400 13px/1.55 var(--sans); color: var(--ink-2);
  padding-left: 15px; position: relative;
}
.evidence li::before {
  content: ""; position: absolute; left: 0; top: .68em;
  width: 8px; height: var(--hair); background: var(--rule-firm);
}
.fault { font: 400 12.5px/1.5 var(--sans); color: var(--ink-3);
         font-style: italic; margin-top: 6px; }

.oxide { color: var(--oxide); } .bg-oxide { background: var(--oxide); }
.ochre { color: var(--ochre); } .bg-ochre { background: var(--ochre); }
.verdi { color: var(--verdi); } .bg-verdi { background: var(--verdi); }
.slate { color: var(--slate); } .bg-slate { background: var(--slate); }

/* ═══════════════════════════════════════════════════ progress ═══ */
.working { border-top: 2px solid var(--ink); padding: var(--gap-4) 0; }
.working .label { margin-bottom: var(--gap-3); }
.roster { display: flex; flex-wrap: wrap; gap: var(--gap-1) var(--gap-3); }
.roster span { font: 400 13px/1.6 var(--mono); color: var(--ink-3); }
.roster span::after { content: " ·"; color: var(--rule-firm); }
.roster span:last-child::after { content: ""; }
.sweep { height: 2px; background: var(--rule); margin-top: var(--gap-3); overflow: hidden; }
.sweep i { display: block; height: 100%; width: 28%; background: var(--ink);
           animation: sweep 1.25s ease-in-out infinite; }
@keyframes sweep { 0% { margin-left: -28%; } 100% { margin-left: 100%; } }

.void { border-top: 2px solid var(--ink); padding: var(--gap-5) 0;
        font: 400 14px/1.5 var(--sans); color: var(--ink-3); }
.void.fault { color: var(--oxide); }

.imprint { margin-top: var(--gap-4); padding-top: var(--gap-3);
           border-top: var(--hair) solid var(--rule);
           font: 400 12px/1.6 var(--mono); color: var(--ink-3); }

/* ═══════════════════════════════════════════════════ narrow ═══ */
@media (max-width: 620px) {
  .sheet { padding: 0 18px 72px; }
  .masthead { flex-direction: column; align-items: flex-start; gap: var(--gap-3); }
  .masthead h1 { font-size: 22px; }
  .colophon { text-align: left; }
  .tally { gap: var(--gap-4); }
  .tally .n { font-size: 25px; }
  .dist { flex-basis: 100%; }
  /* the finding line runs out of measure: give the origin its own line and
     let the name and reading hold the first */
  .line { flex-wrap: wrap; row-gap: 2px; }
  .name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .reading { flex: none; font-size: 15.5px; }
  .origin { flex-basis: 100%; order: 3;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
</style>
</head>
<body>
<div class="sheet">

  <header class="masthead">
    <div>
      <h1>Drift<em>logg</em></h1>
      <p class="sub">A decay report for the packages you depend on — which are
         drifting toward abandonment, and on what evidence.</p>
    </div>
    <div class="colophon">
      <div class="label">Forecast horizon · 90d</div>
      <div class="label" id="engine">Engine · —</div>
      <button class="theme" id="theme">Invert</button>
    </div>
  </header>

  <div class="advisory" id="advisory"><b>Advisory</b><span id="advisory-text"></span></div>

  <section class="query">
    <div class="modes" role="tablist">
      <button class="mode" role="tab" aria-selected="true" data-mode="names">By name</button>
      <button class="mode" role="tab" aria-selected="false" data-mode="file">From manifest</button>
    </div>

    <div id="pane-names">
      <textarea id="names" spellcheck="false"
                placeholder="express&#10;lodash&#10;request&#10;left-pad"></textarea>
      <div class="specimens">
        <span class="label">Specimens</span>
        <button class="specimen" data-fill="request&#10;gulp-util&#10;istanbul&#10;left-pad">Known decayed</button>
        <button class="specimen" data-fill="express&#10;react&#10;lodash&#10;moment">Widely used</button>
        <button class="specimen" data-fill="express&#10;request&#10;lodash&#10;gulp-util&#10;react">Mixed</button>
      </div>
    </div>

    <div id="pane-file" hidden>
      <label class="intake" id="intake" tabindex="0">
        <p id="intake-label">Drop a manifest, or choose a file</p>
        <p class="formats">package.json · requirements.txt · pyproject.toml</p>
        <input type="file" id="file" accept=".json,.txt,.toml">
      </label>
    </div>

    <div class="commit">
      <button class="run" id="go">Run report</button>
      <span class="aside">Each package is resolved and read live; allow a few seconds apiece.</span>
    </div>
  </section>

  <div id="out" aria-live="polite"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const BANDS = ["high", "elevated", "low", "unknown"];
const PIGMENT = { high: "oxide", elevated: "ochre", low: "verdi", unknown: "slate" };
const READING = { high: "Decaying", elevated: "Drifting", low: "Sound", unknown: "Unread" };
let mode = "names";

/* ── theme ─────────────────────────────────────────────────────────── */
const saved = localStorage.getItem("driftlogg-theme");
if (saved) document.documentElement.dataset.theme = saved;
$("#theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = now === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("driftlogg-theme", next);
};

/* ── modes ─────────────────────────────────────────────────────────── */
document.querySelectorAll(".mode").forEach((m) => {
  m.onclick = () => {
    document.querySelectorAll(".mode").forEach((x) => x.setAttribute("aria-selected", "false"));
    m.setAttribute("aria-selected", "true");
    mode = m.dataset.mode;
    $("#pane-names").hidden = mode !== "names";
    $("#pane-file").hidden = mode !== "file";
  };
});
document.querySelectorAll(".specimen").forEach((s) => {
  s.onclick = () => { $("#names").value = s.dataset.fill; $("#names").focus(); };
});

/* ── file intake ───────────────────────────────────────────────────── */
const intake = $("#intake"), fileInput = $("#file");
intake.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
});
["dragenter", "dragover"].forEach((e) =>
  intake.addEventListener(e, (ev) => { ev.preventDefault(); intake.classList.add("over"); }));
["dragleave", "drop"].forEach((e) =>
  intake.addEventListener(e, (ev) => { ev.preventDefault(); intake.classList.remove("over"); }));
intake.addEventListener("drop", (ev) => {
  if (ev.dataTransfer.files.length) { fileInput.files = ev.dataTransfer.files; named(); }
});
fileInput.addEventListener("change", named);
function named() {
  const f = fileInput.files[0];
  $("#intake-label").textContent = f ? f.name : "Drop a manifest, or choose a file";
}

/* ── helpers ───────────────────────────────────────────────────────── */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x) => (x === null || x === undefined ? "—" : Math.round(x * 100) + "%");
const listed = () => $("#names").value.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean);

async function survey() {
  try {
    const h = await (await fetch("/health")).json();
    $("#engine").textContent = "Engine · " + (h.model_loaded ? "lightgbm" : "baseline");
    const notes = [];
    if (!h.model_loaded)
      notes.push("No trained model is loaded; readings come from the inactivity baseline rather than the model.");
    if (!h.github_token_present)
      notes.push("No GitHub token is configured; the API rate limit will be reached quickly.");
    if (notes.length) {
      $("#advisory").style.display = "block";
      $("#advisory-text").textContent = notes.join(" ");
    }
  } catch { /* advisory only */ }
}

/* ── views ─────────────────────────────────────────────────────────── */
function working(roster) {
  $("#out").innerHTML = `
    <section class="working">
      <div class="label">Reading ${roster.length} package${roster.length === 1 ? "" : "s"}</div>
      <div class="roster">${roster.map((n) => `<span>${esc(n)}</span>`).join("")}</div>
      <div class="sweep"><i></i></div>
    </section>`;
}

function report(data) {
  const count = Object.fromEntries(BANDS.map((b) => [b, data.results.filter((r) => r.band === b).length]));
  const total = data.results.length || 1;
  const strip = BANDS.map((b) => count[b]
    ? `<span class="bg-${PIGMENT[b]}" style="width:${(count[b] / total) * 100}%"></span>` : "").join("");
  const key = BANDS.filter((b) => count[b]).map((b) =>
    `<span><i class="swatch bg-${PIGMENT[b]}"></i>${count[b]} ${READING[b].toLowerCase()}</span>`).join("");

  const findings = data.results.map((r) => {
    const p = PIGMENT[r.band];
    const scored = r.score !== null && r.score !== undefined;
    return `
    <article class="finding">
      <div class="line">
        <span class="name">${esc(r.package)}</span>
        ${r.repo ? `<a class="origin" href="https://github.com/${esc(r.repo)}"
            target="_blank" rel="noopener noreferrer">${esc(r.repo)}</a>` : ""}
        <span class="reading ${p}">${pct(r.score)}</span>
      </div>
      ${scored ? `<div class="gauge">
          <i class="bg-${p}" style="width:${r.score * 100}%"></i>
          <b class="bg-${p}" style="left:calc(${r.score * 100}% - 1px)"></b>
        </div>` : ""}
      ${r.reasons.length
        ? `<ul class="evidence">${r.reasons.map((x) => `<li>${esc(x.label)}</li>`).join("")}</ul>` : ""}
      ${r.error ? `<p class="fault">${esc(r.error)}</p>` : ""}
    </article>`;
  }).join("");

  $("#out").innerHTML = `
    <section class="findings">
      <div class="findings-head">
        <div class="tally">
          <div><div class="n">${data.total}</div><div class="label">Read</div></div>
          <div><div class="n risk">${count.high}</div><div class="label">Decaying</div></div>
        </div>
        <div class="dist">
          <div class="strip">${strip}</div>
          <div class="strip-key">${key}</div>
          <div class="ticks"><span>0%</span><span>50%</span><span>100%</span></div>
        </div>
      </div>
      ${findings}
      <p class="imprint">Readings are the modelled probability that a package
        records no commits at all through a 180-day window opening
        ${data.horizon_days} days from today. Engine: ${esc(data.model_kind)}.</p>
    </section>`;
}

function fault(msg) {
  $("#out").innerHTML = `<section class="void fault">${esc(msg)}</section>`;
}

/* ── run ───────────────────────────────────────────────────────────── */
$("#go").onclick = async () => {
  const btn = $("#go");
  btn.disabled = true;
  try {
    let res;
    if (mode === "names") {
      const packages = listed();
      if (!packages.length) throw new Error("Name at least one package to read.");
      working(packages);
      res = await fetch("/score", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ packages }),
      });
    } else {
      const f = fileInput.files[0];
      if (!f) throw new Error("Choose a manifest file first.");
      working([f.name]);
      const fd = new FormData();
      fd.append("file", f);
      res = await fetch("/score/manifest", { method: "POST", body: fd });
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || "The request could not be completed.");
    }
    report(await res.json());
  } catch (e) {
    fault(e.message);
  } finally {
    btn.disabled = false;
  }
};

$("#names").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") $("#go").click();
});

survey();
</script>
