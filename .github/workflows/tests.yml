name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[api,dev]"

      - name: Lint
        run: ruff check driftlogg scripts tests

      - name: Format check
        run: black --check driftlogg scripts tests

      - name: Test
        # No network in CI: the suite is unit-only by design, since anything
        # touching the GitHub API belongs in a separate integration job.
        run: pytest --cov=driftlogg --cov-report=term-missing
